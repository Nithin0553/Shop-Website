name: Cloudflare Worker checks

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "migrations/**"
      - "public/**"
      - "data/**"
      - "lib/**"
      - "tests/**"
      - "wrangler.jsonc"
      - "package.json"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run all Node.js tests
        run: npm test
      - name: Dry-run Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --outdir cloudflare-out
